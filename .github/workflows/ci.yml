name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  secrets-guard:
    name: Forbidden files guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if personal config or credentials are tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(my-config\.json|\.clasp\.json|\.clasprc\.json|\.env|\.env\..+)$|\.local\.|\.(pem|key|p12)$|(^|/)secrets/|(credentials|client_secret|token|service-account)[^/]*\.json$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::Forbidden files tracked:"; echo "$bad"; exit 1; fi
          echo "No forbidden files tracked."
